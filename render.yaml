services:
  - type: web
    name: osv-attestation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OWNER_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
