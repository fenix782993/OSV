services:
  - type: web
    name: osv-attestation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: osv-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_PATH
        value: /var/data/osv.db
      - key: COOKIE_SECURE
        value: "1"
