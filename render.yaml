services:
  - type: web
    name: osv-attestation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
